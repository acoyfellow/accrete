<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>accrete · v1</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .plate { position: fixed; inset: 0; background: url(v1a.jpg) center / cover no-repeat; opacity: 0; mix-blend-mode: screen; animation: breathe 9s ease-in-out infinite; pointer-events: none; }
  .bar { position: fixed; left: 50%; bottom: 9vh; width: 34vw; height: 3px; transform: translateX(-50%); background: #ffffff10; overflow: hidden; border-radius: 3px; }
  .bar i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, #ff6a1a, #ffd27a, #3dff9a); animation: fill 9s cubic-bezier(.7,0,.2,1) infinite; box-shadow: 0 0 18px #ff8a3a; }
  .pips { position: fixed; left: 50%; bottom: calc(9vh + 18px); transform: translateX(-50%); display: flex; gap: 14px; }
  .pips b { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid #ff8a3a66; animation: pip 9s steps(1) infinite; }
  .pips b:nth-child(2) { animation-delay: .6s } .pips b:nth-child(3) { animation-delay: 1.2s } .pips b:nth-child(4) { animation-delay: 1.8s }
  @keyframes fill { 0% { transform: scaleX(0) } 55% { transform: scaleX(.62) } 62% { transform: scaleX(.62) } 100% { transform: scaleX(1) } }
  @keyframes breathe { 0%, 100% { opacity: 0 } 70% { opacity: .0 } 85% { opacity: .35 } }
  @keyframes pip { 0%, 60% { background: transparent } 61%, 100% { background: #3dff9a; border-color: #3dff9a; box-shadow: 0 0 12px #3dff9a } }
</style>
</head>
<body>
<div class="plate"></div>
<canvas id="c"></canvas>
<div class="pips"><b></b><b></b><b></b><b></b></div>
<div class="bar"><i></i></div>
<script>
const canvas = document.getElementById("c");
const g = canvas.getContext("2d");
let W, H, D;
const resize = () => { D = devicePixelRatio || 1; W = canvas.width = innerWidth * D; H = canvas.height = innerHeight * D; };
addEventListener("resize", resize); resize();

const CYCLE = 9000;
const N = 900;
const grains = Array.from({ length: N }, (_, i) => ({ i, u: Math.random(), v: Math.random(), w: Math.random(), seed: Math.random() * 6.28 }));
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp = (t) => Math.max(0, Math.min(1, t));
let mx = .5, my = .5;
addEventListener("pointermove", (e) => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; });

const crystal = (k, r, a) => {
  const facets = 8;
  const f = k % facets;
  const ang = (f / facets) * Math.PI * 2 + a;
  const ring = Math.floor(k / facets) % 6;
  const rr = r * (0.25 + ring * 0.15);
  return [Math.cos(ang) * rr, Math.sin(ang) * rr * 1.25 - r * 0.1 * (3 - ring)];
};

const frame = (now) => {
  const t = (now % CYCLE) / CYCLE;
  const cx = W * .5 + (mx - .5) * 40 * D, cy = H * .46 + (my - .5) * 30 * D;
  const S = Math.min(W, H);
  g.fillStyle = "rgba(0,0,0,0.22)"; g.fillRect(0, 0, W, H);

  const boxX = W * .2, boxY = H * .5, bw = S * .22, bh = S * .14;
  const dissolve = ease(clamp((t - .05) / .45));
  const gather = ease(clamp((t - .3) / .35));
  const flash = clamp(1 - Math.abs(t - .66) / .04);
  const spin = now / 2400;

  for (const p of grains) {
    const sx = boxX + (p.u - .5) * bw, sy = boxY + (p.v - .5) * bh;
    const released = p.u < dissolve * 1.1;
    const [tx, ty] = crystal(p.i, S * .11 * (1 + flash * .25), spin);
    const ex = cx + tx, ey = cy + ty;
    const k = released ? clamp((gather * 1.4) - p.w * .4) : 0;
    const arc = Math.sin(k * Math.PI) * S * .18 * (p.w - .5);
    const x = sx + (ex - sx) * k + Math.cos(p.seed + now / 700) * (released ? (1 - k) * 18 * D : 0);
    const y = sy + (ey - sy) * k - arc;
    const hot = k > .98;
    g.fillStyle = hot ? `hsla(${24 + p.w * 20},100%,${60 + flash * 30}%,0.95)` : released ? "rgba(255,180,110,0.7)" : "rgba(120,130,145,0.85)";
    const s = (hot ? 2.4 : 1.6) * D;
    g.fillRect(x, y, s, s);
  }

  if (dissolve < 1) {
    g.strokeStyle = `rgba(150,160,175,${0.5 * (1 - dissolve)})`; g.lineWidth = D;
    for (let i = 0; i <= 10; i++) { const x = boxX - bw / 2 + (bw * i) / 10; if ((i / 10) > dissolve) { g.beginPath(); g.moveTo(x, boxY - bh / 2); g.lineTo(x, boxY + bh / 2); g.stroke(); } }
  }

  if (t > .62) {
    const glow = g.createRadialGradient(cx, cy, 0, cx, cy, S * .35);
    const a = flash * .55 + .12;
    glow.addColorStop(0, `rgba(255,150,60,${a})`); glow.addColorStop(.4, `rgba(255,90,20,${a * .3})`); glow.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    const reps = Math.floor(clamp((t - .7) / .25) * 4);
    for (let r = 0; r < reps; r++) {
      const ox = cx + (r - 1.5) * S * .14, oy = H * .82;
      g.save(); g.translate(ox, oy); g.rotate(Math.PI / 4);
      g.strokeStyle = "#3dff9a"; g.shadowColor = "#3dff9a"; g.shadowBlur = 16 * D; g.lineWidth = 1.5 * D;
      g.strokeRect(-7 * D, -7 * D, 14 * D, 14 * D); g.restore();
      g.strokeStyle = "rgba(61,255,154,0.35)"; g.beginPath(); g.moveTo(cx, cy); g.lineTo(ox, oy); g.stroke();
    }
  }

  g.strokeStyle = `rgba(61,255,154,${.25 + flash * .6})`; g.lineWidth = D;
  g.beginPath(); g.ellipse(cx, cy + S * .2, S * (.18 + flash * .1), S * .025, 0, 0, Math.PI * 2); g.stroke();
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
